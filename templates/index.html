{% extends "base.html" %}

{% block title %} Home {% endblock %}

{% block main %}
<section class="min-h-screen bg-gradient-to-br from-blue-50 to-indigo-100 flex items-center justify-center">
    <div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 text-center">
        <div class="space-y-8">
            <div class="flex justify-center items-center space-x-3 mb-4">
                <i class="bi bi-wallet2 text-6xl text-blue-600"></i>
            </div>
            <h1 class="text-6xl md:text-7xl lg:text-8xl font-extrabold text-gray-900 tracking-tight">
                TRACKIT
            </h1>
            <p class="text-2xl md:text-3xl lg:text-4xl text-gray-700 font-light leading-relaxed">
                Tracking Real-time Accounts,<br> 
                Costs, and Keeping It Tidy
            </p>
            <div class="pt-8 space-x-4">
                {% if current_user.is_authenticated %}
                    <a href="{{ url_for('events_overview')}}" 
                       class="inline-flex items-center px-8 py-4 text-lg font-medium rounded-lg text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-4 focus:ring-blue-300 transition duration-150 ease-in-out shadow-lg hover:shadow-xl transform hover:-translate-y-0.5">
                        <i class="bi bi-calendar-event mr-2"></i>
                        Go to Events Overview
                    </a>
                {% else %}
                    <a href="{{ url_for('log_in')}}" 
                       class="inline-flex items-center px-8 py-4 text-lg font-medium rounded-lg text-blue-600 bg-white border-2 border-blue-600 hover:bg-blue-50 focus:outline-none focus:ring-4 focus:ring-blue-300 transition duration-150 ease-in-out shadow-md hover:shadow-lg transform hover:-translate-y-0.5">
                        <i class="bi bi-box-arrow-in-right mr-2"></i>
                        Login
                    </a>
                    <a href="{{ url_for('sign_up')}}" 
                       class="inline-flex items-center px-8 py-4 text-lg font-medium rounded-lg text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-4 focus:ring-blue-300 transition duration-150 ease-in-out shadow-lg hover:shadow-xl transform hover:-translate-y-0.5">
                        <i class="bi bi-person-plus mr-2"></i>
                        Create an Account
                    </a>
                {% endif %}
            </div>
        </div>
    </div>
</section>
{% endblock %}
