{% extends "base.html" %}

{% block title %} Add New Event {% endblock %}

{% block main %}

<section class="min-h-screen bg-gray-50 py-8 px-4 sm:px-6 lg:px-8">
    <div class="max-w-2xl mx-auto">
        <div class="bg-white rounded-lg shadow-md p-8">
            <div class="mb-8">
                <h1 class="text-3xl font-bold text-gray-900 text-center">Add New Event</h1>
                <p class="text-gray-600 text-center mt-2">Fill in the details to create a new event</p>
            </div>
            
            <form method="POST" action="{{ url_for('add_event') }}" enctype="multipart/form-data" class="space-y-6">
                <div>
                    <label for="eventImage" class="block text-sm font-medium text-gray-700 mb-2">
                        <i class="bi bi-image mr-1"></i> Event Image
                    </label>
                    <input type="file" 
                           id="eventImage" 
                           name="eventImage" 
                           accept="image/*" 
                           required
                           class="block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-md file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100 cursor-pointer border border-gray-300 rounded-md">
                </div>

                <div>
                    <label for="eventTitle" class="block text-sm font-medium text-gray-700 mb-2">
                        <i class="bi bi-card-heading mr-1"></i> Title of the Event
                    </label>
                    <input type="text" 
                           id="eventTitle" 
                           name="eventTitle" 
                           placeholder="Enter event title" 
                           required
                           class="appearance-none block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm placeholder-gray-400 focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm">
                </div>

                <div>
                    <label for="eventDateTime" class="block text-sm font-medium text-gray-700 mb-2">
                        <i class="bi bi-calendar-event mr-1"></i> Date and Time of the Event
                    </label>
                    <input type="datetime-local" 
                           id="eventDateTime" 
                           name="eventDateTime" 
                           required
                           class="appearance-none block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm">
                </div>

                <div>
                    <label for="eventDescription" class="block text-sm font-medium text-gray-700 mb-2">
                        <i class="bi bi-text-paragraph mr-1"></i> Short Description of the Event
                    </label>
                    <textarea id="eventDescription" 
                              name="eventDescription" 
                              rows="4" 
                              required
                              placeholder="Describe your event..."
                              class="appearance-none block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm placeholder-gray-400 focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm"></textarea>
                </div>

                <div>
                    <label for="eventBudget" class="block text-sm font-medium text-gray-700 mb-2">
                        <i class="bi bi-cash-stack mr-1"></i> Budget
                    </label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <span class="text-gray-500 sm:text-sm">PHP</span>
                        </div>
                        <input type="number" 
                               id="eventBudget" 
                               name="eventBudget" 
                               placeholder="0.00" 
                               required 
                               min="0" 
                               step="0.01"
                               class="appearance-none block w-full pl-12 pr-3 py-2 border border-gray-300 rounded-md shadow-sm placeholder-gray-400 focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm">
                    </div>
                </div>

                <div class="flex gap-4">
                    <button type="submit" 
                            class="flex-1 flex justify-center py-3 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 transition duration-150 ease-in-out">
                        <i class="bi bi-check-circle mr-2"></i> Create Event
                    </button>
                    <a href="{{ url_for('events_overview') }}" 
                       class="flex-1 flex justify-center py-3 px-4 border border-gray-300 rounded-md shadow-sm text-sm font-medium text-gray-700 bg-white hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 transition duration-150 ease-in-out">
                        <i class="bi bi-x-circle mr-2"></i> Cancel
                    </a>
                </div>
            </form>
        </div>
    </div>
</section>

{% endblock %}
